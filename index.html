<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>瑟瑟大冒险</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;color:#fff;background:linear-gradient(145deg,#1a0a2e 0%,#16213e 50%,#0f3460 100%);background-attachment:fixed}
.app{width:100%;height:100%;max-width:430px;margin:0 auto;position:relative;overflow:hidden}

/* ===== 页面通用 ===== */
.page{display:none;position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden}
.page.active{display:block;animation:pageFadeIn 350ms ease}
.page-inner{width:100%;height:100%;display:flex;flex-direction:column}
@keyframes pageFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ===== 页面 A：主页 ===== */
.home-page{padding:0 20px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}
.home-header{text-align:center;padding:48px 0 28px}
.home-deco{font-size:22px;letter-spacing:10px;margin-bottom:10px;opacity:.7}
.home-title{font-size:28px;font-weight:800;background:linear-gradient(135deg,#FFB6C1,#FF69B4,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.home-subtitle{font-size:14px;color:rgba(255,255,255,.55)}
.map-cards{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
.map-card{background:rgba(255,255,255,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:transform 150ms ease,box-shadow 200ms ease;position:relative;overflow:hidden}
.map-card::before{content:'';position:absolute;inset:0;opacity:.06;transition:opacity 150ms ease}
.map-card:active{transform:scale(.97)}
.map-card-emoji{font-size:36px;min-width:48px;text-align:center}
.map-card-info{flex:1;z-index:1}
.map-card-name{font-size:18px;font-weight:600;margin-bottom:4px}
.map-card-desc{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:6px}
.map-card-steps{font-size:12px;color:rgba(255,255,255,.4);background:rgba(255,255,255,.08);padding:2px 10px;border-radius:10px;display:inline-block}
.map-card-arrow{font-size:18px;color:rgba(255,255,255,.25);z-index:1}
.settings-entry{width:100%;padding:14px;border:1px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.05);color:rgba(255,255,255,.65);font-size:15px;cursor:pointer;transition:transform 150ms ease;margin-bottom:24px}
.settings-entry:active{transform:scale(.97)}

/* ===== 页面 B：游戏页 ===== */
.game-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:rgba(0,0,0,.3);min-height:48px;flex-shrink:0}
.hdr-btn{background:none;border:none;color:rgba(255,255,255,.8);font-size:14px;padding:8px 12px;cursor:pointer;min-width:56px;text-align:left}
.hdr-btn:active{opacity:.5}
.turn-ind{font-size:14px;font-weight:600;padding:4px 14px;border-radius:14px;transition:background .3s,color .3s}
.turn-ind.male{background:rgba(66,165,245,.25);color:#90CAF9}
.turn-ind.female{background:rgba(236,64,122,.25);color:#FF80AB}
.game-map-name{font-size:13px;color:rgba(255,255,255,.45);min-width:56px;text-align:right}
.board-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 0}
.board-wrap{position:relative;padding-bottom:24px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.07);position:relative;transition:background .3s}
.cell-start{background:rgba(76,175,80,.18)!important;border-color:rgba(76,175,80,.25)!important}
.cell-end{background:rgba(255,215,0,.18)!important;border-color:rgba(255,215,0,.28)!important}
.cell-icon{font-size:16px;line-height:1}
.cell-label{font-size:9px;color:rgba(255,255,255,.45);margin-top:1px}
.cell-num{font-size:14px;font-weight:500;color:rgba(255,255,255,.55)}
.cell-glow-m{box-shadow:inset 0 0 0 2px rgba(66,165,245,.4),0 0 12px rgba(66,165,245,.25)}
.cell-glow-f{box-shadow:inset 0 0 0 2px rgba(236,64,122,.4),0 0 12px rgba(236,64,122,.25)}
.piece{position:absolute;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;z-index:10;pointer-events:none;transform:translate(-50%,-50%);transition:left 280ms ease-in-out,top 280ms ease-in-out;box-shadow:0 2px 10px rgba(0,0,0,.45);left:-50px;top:-50px}
.piece-m{background:linear-gradient(135deg,#42A5F5,#1565C0);color:#fff;border:2px solid rgba(255,255,255,.4)}
.piece-f{background:linear-gradient(135deg,#EC407A,#C2185B);color:#fff;border:2px solid rgba(255,255,255,.4)}
@keyframes pieceBounce{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.piece-bouncing{animation:pieceBounce 280ms ease}
.game-ctrl{padding:12px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.3);text-align:center;flex-shrink:0}
.game-pos{display:flex;justify-content:center;gap:20px;margin-bottom:12px}
.pos-lbl{font-size:13px;padding:4px 12px;border-radius:10px}
.pos-m{background:rgba(66,165,245,.12);color:#90CAF9}
.pos-f{background:rgba(236,64,122,.12);color:#FF80AB}
.roll-btn{width:200px;height:52px;border:none;border-radius:26px;font-size:18px;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,#FF6B6B,#EE5A24);box-shadow:0 4px 18px rgba(238,90,36,.35);transition:transform 150ms ease,box-shadow 150ms ease}
.roll-btn:active:not(:disabled){transform:scale(.92);box-shadow:0 2px 8px rgba(238,90,36,.25)}
.roll-btn:disabled{opacity:.45;cursor:not-allowed}

/* ===== 页面 C：设置页 ===== */
.settings-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:rgba(0,0,0,.3);min-height:48px;flex-shrink:0}
.settings-title{font-size:17px;font-weight:600}
.hdr-spacer{min-width:56px}
.stabs{display:flex;gap:7px;padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-shrink:0}
.stabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:7px 14px;border-radius:18px;font-size:13px;border:1px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.55);cursor:pointer;transition:all .2s;white-space:nowrap}
.stab.active{background:var(--tc,#FFB6C1);color:#fff;border-color:transparent}
.scontent{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 12px}
.steps-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,.05);border-radius:12px;margin-bottom:12px}
.steps-lbl{font-size:14px;color:rgba(255,255,255,.65)}
.steps-inp{width:80px;padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.08);color:#fff;font-size:16px;text-align:center}
.ev-item{display:flex;align-items:flex-start;gap:8px;padding:10px;background:rgba(255,255,255,.04);border-radius:10px;margin-bottom:8px}
.ev-idx{min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.35);background:rgba(255,255,255,.06);border-radius:6px;margin-top:4px}
.ev-text{flex:1;padding:8px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:14px;line-height:1.4;min-height:44px;resize:vertical;font-family:inherit}
.ev-text:focus{border-color:var(--tc,#FFB6C1);outline:none;background:rgba(255,255,255,.1)}
.ev-text.err{border-color:#f44336;background:rgba(244,67,54,.08)}
.ev-del{width:36px;height:36px;border:none;background:rgba(244,67,54,.1);border-radius:8px;font-size:16px;cursor:pointer;color:#ef9a9a;margin-top:4px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.ev-del:active{background:rgba(244,67,54,.25)}
.sactions{padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;flex-shrink:0;background:rgba(0,0,0,.2)}
.abtn{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;cursor:pointer;transition:transform 150ms ease;color:#fff}
.abtn:active{transform:scale(.97)}
.abtn-add{background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.25)}
.abtn-save{background:linear-gradient(135deg,#43A047,#2E7D32)}
.abtn-cloud{background:rgba(33,150,243,.18);border:1px solid rgba(33,150,243,.25)}
.abtn-def{background:rgba(255,152,0,.18);border:1px solid rgba(255,152,0,.25)}

/* ===== 模态弹窗 ===== */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;visibility:hidden;transition:opacity .3s}
.modal-ov.active{opacity:1;visibility:visible}
.modal-box{background:linear-gradient(150deg,#2d1b4e,#1a1a3e,#162040);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px 22px;max-width:320px;width:85%;text-align:center;transform:scale(.85) translateY(20px);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.modal-ov.active .modal-box{transform:scale(1) translateY(0)}
.modal-ttl{font-size:20px;font-weight:700;margin-bottom:14px}
.modal-body{font-size:17px;line-height:1.6;color:rgba(255,255,255,.85);margin-bottom:22px;white-space:pre-line;word-break:break-word}
.modal-acts{display:flex;flex-direction:column;gap:10px}
.mbtn{width:100%;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:transform 150ms ease;color:#fff}
.mbtn:active{transform:scale(.95)}
.mbtn-pri{background:linear-gradient(135deg,#FF6B6B,#EE5A24)}
.mbtn-sec{background:rgba(255,255,255,.12)}
.mbtn-ok{background:linear-gradient(135deg,#43A047,#2E7D32)}

/* ===== 骰子动画层 ===== */
.dice-ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:80;pointer-events:none;opacity:0;transition:opacity .25s;background:rgba(0,0,0,.35)}
.dice-ov.active{opacity:1}
.dice-val{font-size:80px;filter:drop-shadow(0 4px 24px rgba(0,0,0,.55));transition:transform 80ms ease}
@keyframes rollPulse{0%,100%{box-shadow:0 4px 18px rgba(238,90,36,.35)}50%{box-shadow:0 4px 28px rgba(238,90,36,.55)}}
.roll-btn:not(:disabled){animation:rollPulse 2s infinite ease-in-out}

/* ===== Toast ===== */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-120px);background:rgba(25,25,45,.92);border:1px solid rgba(255,255,255,.1);color:#fff;padding:10px 24px;border-radius:10px;font-size:14px;z-index:200;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== 档位选择面板 ===== */
.mode-row{display:flex;gap:12px;justify-content:center;margin-bottom:4px}
.mode-card{flex:1;max-width:140px;padding:16px 10px;border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);cursor:pointer;transition:all .2s;text-align:center}
.mode-card:active{transform:scale(.96)}
.mode-card.mode-sel{border-color:var(--tc,#FFB6C1);background:rgba(255,255,255,.12);box-shadow:0 0 18px rgba(255,182,193,.2)}
.mode-icon{font-size:24px;margin-bottom:6px}
.mode-lbl{font-size:15px;font-weight:600;margin-bottom:4px}
.mode-stp{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:2px}
.mode-dur{font-size:12px;color:rgba(255,255,255,.4)}
.modes-info{font-size:13px;color:rgba(255,255,255,.5);line-height:1.5}
</style>
</head>
<body>
<div class="app">

  <!-- ===== 页面 A：主页 ===== -->
  <div id="page-home" class="page active">
    <div class="page-inner home-page">
      <div class="home-header">
        <div class="home-deco">✨ 💕 ✨</div>
        <h1 class="home-title">瑟瑟大冒险</h1>
        <p class="home-subtitle">选择一个方案，开启你们的浪漫之旅</p>
      </div>
      <div id="map-cards" class="map-cards"></div>
      <button class="settings-entry" id="btn-go-settings" aria-label="设置">⚙️ 设置 / 编辑玩法</button>
    </div>
  </div>

  <!-- ===== 页面 B：游戏页 ===== -->
  <div id="page-game" class="page">
    <div class="page-inner">
      <div class="game-header">
        <button class="hdr-btn" id="btn-exit" aria-label="退出游戏">← 退出</button>
        <div id="turn-ind" class="turn-ind male">♂ 男方的回合</div>
        <div id="gmap-name" class="game-map-name"></div>
      </div>
      <div id="board-scroll" class="board-scroll">
        <div class="board-wrap" id="board-wrap">
          <div class="board" id="board"></div>
          <div class="piece piece-m" id="piece-m">他</div>
          <div class="piece piece-f" id="piece-f">她</div>
        </div>
      </div>
      <div class="game-ctrl">
        <div class="game-pos">
          <span class="pos-lbl pos-m" id="pos-m">他：起点</span>
          <span class="pos-lbl pos-f" id="pos-f">她：起点</span>
        </div>
        <button class="roll-btn" id="btn-roll" aria-label="掷骰子">🎲 掷骰子</button>
      </div>
    </div>
  </div>

  <!-- ===== 页面 C：设置页 ===== -->
  <div id="page-settings" class="page">
    <div class="page-inner">
      <div class="settings-header">
        <button class="hdr-btn" id="btn-back-home" aria-label="返回主页">← 返回</button>
        <h2 class="settings-title">编辑玩法</h2>
        <div class="hdr-spacer"></div>
      </div>
      <div class="stabs" id="stabs"></div>
      <div class="scontent" id="scontent"></div>
      <div class="sactions">
        <button class="abtn abtn-add" id="btn-add">➕ 新增玩法</button>
        <button class="abtn abtn-save" id="btn-save">💾 保存修改</button>
        <button class="abtn abtn-cloud" id="btn-cloud">☁️ 恢复为云端版本</button>
        <button class="abtn abtn-def" id="btn-def">🔄 恢复为内置默认</button>
      </div>
    </div>
  </div>
</div>

<!-- 模态弹窗 -->
<div class="modal-ov" id="modal-ov">
  <div class="modal-box">
    <div class="modal-ttl" id="modal-ttl"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-acts" id="modal-acts"></div>
  </div>
</div>

<!-- 骰子动画层 -->
<div class="dice-ov" id="dice-ov">
  <div class="dice-val" id="dice-val">🎲</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

function sleep(ms) {
  return new Promise(function(r) { setTimeout(r, ms); });
}

// Fisher-Yates 洗牌算法
function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// 深拷贝
function deepClone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

var _toastTimer = null;
function showToast(msg, dur) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { el.classList.remove('show'); }, dur || 2000);
}

// 通用模态弹窗（body 可为字符串或 DOM 元素）
function showModal(title, body, buttons) {
  var ov = document.getElementById('modal-ov');
  document.getElementById('modal-ttl').textContent = title;
  var bodyEl = document.getElementById('modal-body');
  if (typeof body === 'string') {
    bodyEl.textContent = body;
  } else {
    bodyEl.innerHTML = '';
    bodyEl.appendChild(body);
  }
  var acts = document.getElementById('modal-acts');
  acts.innerHTML = '';
  buttons.forEach(function(b) {
    var btn = document.createElement('button');
    btn.className = 'mbtn ' + (b.cls || 'mbtn-pri');
    btn.textContent = b.text;
    btn.onclick = function() { hideModal(); if (b.fn) b.fn(); };
    acts.appendChild(btn);
  });
  ov.classList.add('active');
}

function hideModal() {

// Promise 风格的确认弹窗

      { text: '取消', cls: 'mbtn-sec', fn: function() { resolve(false); } },
      { text: '确定', cls: 'mbtn-pri', fn: function() { resolve(true); } }
    ]);
  });
}

// 获取补充玩法池（使用 supplementFrom 字段配置来源）
function getSupplementPool(mapId, maps, common) {
  var map = maps[mapId];
  var sources = (map && map.supplementFrom) || ['common'];
  var pool = [];
  sources.forEach(function(src) {
    if (src === 'common') {
      common.forEach(function(e) { pool.push({ event: e.event }); });
    } else if (maps[src]) {
      maps[src].events.forEach(function(e) { pool.push({ event: e.event }); });
    }
  });
  return pool;
}

// 为一局游戏准备事件列表（洗牌 + 分配到格子）
function prepareEvents(mapId, totalSteps) {
  var cfg = S.config;
  var map = cfg.maps[mapId];
  var dedicated = map.events.map(function(e) { return { event: e.event }; });
  var total = totalSteps;
  var events;

  if (total <= dedicated.length) {
    // 情况 A：步数 ≤ 专属条数，仅从专属中随机抽取
    events = shuffle(dedicated).slice(0, total);
  } else {
    // 情况 B：步数 > 专属条数，专属全用 + 补充差额
    var deficit = total - dedicated.length;
    var pool = getSupplementPool(mapId, cfg.maps, cfg.commonEvents);

    // 按文案内容去重，排除与专属玩法重复的条目
    var usedTexts = {};
    dedicated.forEach(function(e) { usedTexts[e.event] = true; });
    pool = pool.filter(function(e) { return !usedTexts[e.event]; });

    if (pool.length >= deficit) {
      var fillers = shuffle(pool).slice(0, deficit);
      events = dedicated.concat(fillers);
    } else {
      // 补充池不足，用全部可用的
      events = dedicated.concat(pool);
      total = events.length;
      showToast('玩法数量不足，已自动调整棋盘步数');
    }
  }

  // Fisher-Yates 洗牌
  events = shuffle(events);

  // 分配到格子 1 ~ total
  var result = [];
  for (var i = 0; i < events.length; i++) {
    result.push({ step: i + 1, event: events[i].event });
  }
  return { shuffledEvents: result, totalSteps: total };
}

// 兼容旧版数据结构（totalSteps → modes，补充 supplementFrom）
function migrateConfig(maps) {
  var defaultSup = { pure: ['common'], sweet: ['common'], deep: ['common','sweet'], sm: ['common','sweet','deep'] };
  MAP_IDS.forEach(function(id) {
    var m = maps[id];
    if (!m) return;
    if (m.totalSteps && !m.modes) {
      m.modes = [{ label: '标准局', steps: m.totalSteps, duration: '' }];
      delete m.totalSteps;
    }
    if (!m.supplementFrom) {
      m.supplementFrom = defaultSup[id] || ['common'];
    }
  });
  return maps;
}

// 加载配置（远程 → 本地覆盖 → 内置默认）
async function loadConfig() {
  // 尝试 fetch 远程 config.json
  var remote = null;
  try {
    var resp = await fetch('./config.json?t=' + Date.now());
    if (resp.ok) remote = await resp.json();
  } catch (e) {
    console.warn('远程 config.json 加载失败，将使用内置默认数据', e);
  }

  S.remoteConfig = remote;

  // 版本检测与同步
  if (remote) {
    var localVer = null;
    try { localVer = localStorage.getItem('config_version'); } catch(e) {}
    var hasLocal = false;
    try { hasLocal = localStorage.getItem('local_maps') !== null; } catch(e) {}

    if (localVer !== remote.version) {
      // 远程有更新
      if (hasLocal) {
        // 用户有本地修改，提示是否同步
        var sync = await confirmDialog(
          '发现新版本',
          '检测到管理员已更新玩法配置，是否同步最新版本？\n（同步将覆盖你的本地修改）'
        );
        if (sync) {
          clearLocalOverride();
          try { localStorage.setItem('config_version', remote.version); } catch(e) {}
        }
      } else {
        // 无本地修改，静默更新版本号
        try { localStorage.setItem('config_version', remote.version); } catch(e) {}
      }
    }
  }

  // 确定最终使用的配置
  var localMaps = null, localCommon = null;
  try {
    var lm = localStorage.getItem('local_maps');
    var lc = localStorage.getItem('local_common_events');
    if (lm) localMaps = JSON.parse(lm);
    if (lc) localCommon = JSON.parse(lc);
  } catch (e) {}

  var base = remote || DEFAULT_CONFIG;

  var finalMaps = localMaps || deepClone(base.maps);
  migrateConfig(finalMaps); // 兼容旧版数据结构

  S.config = {
    version: base.version,
    maps: finalMaps,
    commonEvents: localCommon || deepClone(base.commonEvents)
  };
}

function saveLocalOverride() {
  try {
    localStorage.setItem('local_maps', JSON.stringify(S.config.maps));
    localStorage.setItem('local_common_events', JSON.stringify(S.config.commonEvents));
  } catch (e) {
    console.warn('localStorage 写入失败', e);
  }
}

function clearLocalOverride() {
  try {
    localStorage.removeItem('local_maps');
    localStorage.removeItem('local_common_events');
  } catch (e) {}
}

var COLS = 5; // 棋盘列数

// 颜色工具函数
function hexToRgba(hex, alpha) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function startGame(mapId) {
  var map = S.config.maps[mapId];
  var modes = map.modes || [];

  // 仅一个档位（如纯爱版），跳过选择面板
  if (modes.length <= 1) {
    var steps = modes.length === 1 ? modes[0].steps : 30;
    proceedWithMode(mapId, steps);
    return;
  }

  // 多档位：弹出局前设置面板
  showModePanel(mapId);
}

// 局前设置面板
function showModePanel(mapId) {
  var map = S.config.maps[mapId];
  var modes = map.modes;
  var selectedSteps = modes[0].steps; // 默认选中第一个（标准局）

  var container = document.createElement('div');
  container.style.textAlign = 'center';

  var label = document.createElement('div');
  label.textContent = '选择游戏时长：';
  label.style.cssText = 'margin-bottom:16px;font-size:15px;color:rgba(255,255,255,.65)';
  container.appendChild(label);

  var row = document.createElement('div');
  row.className = 'mode-row';

  modes.forEach(function(mode, idx) {
    var card = document.createElement('div');
    card.className = 'mode-card' + (idx === 0 ? ' mode-sel' : '');
    card.style.setProperty('--tc', map.themeColor);
    card.innerHTML =
      '<div class="mode-icon">' + (idx === 0 ? '⭐' : '🔥') + '</div>' +
      '<div class="mode-lbl">' + mode.label + '</div>' +
      '<div class="mode-stp">' + mode.steps + ' 步</div>' +
      '<div class="mode-dur">' + mode.duration + '</div>';
    card.onclick = function() {
      selectedSteps = mode.steps;
      row.querySelectorAll('.mode-card').forEach(function(c) { c.classList.remove('mode-sel'); });
      card.classList.add('mode-sel');
    };
    row.appendChild(card);
  });
  container.appendChild(row);

  showModal(map.emoji + ' ' + map.name, container, [
    { text: '🎲 开始游戏', cls: 'mbtn-pri', fn: function() { proceedWithMode(mapId, selectedSteps); } }
  ]);
}

// 检查存档并进入游戏
function proceedWithMode(mapId, totalSteps) {
  var saved = loadGameState();
  if (saved && saved.mapId === mapId && saved.totalSteps === totalSteps &&
      saved.malePosition < saved.totalSteps && saved.femalePosition < saved.totalSteps) {
    showModal('继续游戏？', '检测到上次未完成的游戏，是否继续？', [
      { text: '新游戏', cls: 'mbtn-sec', fn: function() { clearGameState(); initNewGame(mapId, totalSteps); } },
      { text: '继续', cls: 'mbtn-pri', fn: function() { resumeGame(saved); } }
    ]);
  } else {
    clearGameState();
    initNewGame(mapId, totalSteps);
  }
}

function initNewGame(mapId, totalSteps) {
  var prep = prepareEvents(mapId, totalSteps);
  S.gameState = {
    mapId: mapId,
    totalSteps: prep.totalSteps,
    malePosition: 0,
    femalePosition: 0,
    currentTurn: Math.random() < 0.5 ? 'male' : 'female',
    shuffledEvents: prep.shuffledEvents
  };
  saveGameState();
  enterGamePage();
  showToast(S.gameState.currentTurn === 'male' ? '♂ 男方先手！' : '♀ 女方先手！');
}

function resumeGame(gs) {
  S.gameState = gs;
  enterGamePage();
  showToast('已恢复上次进度');
}

function enterGamePage() {
  showPage('game');
  var map = S.config.maps[S.gameState.mapId];
  document.getElementById('gmap-name').textContent = map.name;
  document.body.style.setProperty('--tc', map.themeColor);
  renderBoard();
  updateTurnUI();
  updatePosUI();

  // 延迟滚动到棋子位置
  setTimeout(function() {
    var pos = S.gameState.currentTurn === 'male' ? S.gameState.malePosition : S.gameState.femalePosition;
    scrollToCell(pos);
  }, 400);
}

function renderBoard() {
  var total = S.gameState.totalSteps;
  var totalCells = total + 1; // 0 ~ totalSteps
  var totalRows = Math.ceil(totalCells / COLS);
  var board = document.getElementById('board');
  board.innerHTML = '';
  board.style.gridTemplateRows = 'repeat(' + totalRows + ', auto)';

  var themeColor = S.config.maps[S.gameState.mapId].themeColor;
  var cellBg = hexToRgba(themeColor, 0.07);
  var cellBorder = hexToRgba(themeColor, 0.14);

  for (var i = 0; i < totalCells; i++) {
    var row = Math.floor(i / COLS);
    var posInRow = i % COLS;
    var col = (row % 2 === 0) ? posInRow : (COLS - 1 - posInRow);
    var visRow = totalRows - row; // 底部为 row=0 → 视觉行号大

    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.idx = i;
    cell.style.gridRow = visRow;
    cell.style.gridColumn = col + 1;

    if (i === 0) {
      cell.classList.add('cell-start');
      cell.innerHTML = '<span class="cell-icon">🚩</span><span class="cell-label">起点</span>';
    } else if (i === total) {
      cell.classList.add('cell-end');
      cell.innerHTML = '<span class="cell-icon">🏆</span><span class="cell-label">终点</span>';
    } else {
      cell.style.background = cellBg;
      cell.style.borderColor = cellBorder;
      cell.innerHTML = '<span class="cell-num">' + i + '</span>';
    }

    board.appendChild(cell);
  }

  // 等待布局完成后定位棋子（禁用过渡以避免滑入效果）
  requestAnimationFrame(function() {
    var pm = document.getElementById('piece-m');
    var pf = document.getElementById('piece-f');
    pm.style.transition = 'none';
    pf.style.transition = 'none';
    positionPieces();
    // 下一帧恢复过渡
    requestAnimationFrame(function() {
      pm.style.transition = '';
      pf.style.transition = '';
    });
  });
}

function positionPieces() {
  var gs = S.gameState;
  if (!gs) return;

  // 清除旧高亮
  document.querySelectorAll('.cell-glow-m,.cell-glow-f').forEach(function(c) {
    c.classList.remove('cell-glow-m', 'cell-glow-f');
  });

  var sameCell = gs.malePosition === gs.femalePosition;
  var offset = sameCell ? 13 : 0;
  placePiece('piece-m', gs.malePosition, -offset);
  placePiece('piece-f', gs.femalePosition, offset);

  // 高亮棋子所在格子
  var mc = document.querySelector('.cell[data-idx="' + gs.malePosition + '"]');
  var fc = document.querySelector('.cell[data-idx="' + gs.femalePosition + '"]');
  if (mc) mc.classList.add('cell-glow-m');
  if (fc) fc.classList.add('cell-glow-f');
}

function placePiece(pieceId, cellIdx, xOff) {
  var cell = document.querySelector('.cell[data-idx="' + cellIdx + '"]');
  var piece = document.getElementById(pieceId);
  if (!cell || !piece) return;
  var x = cell.offsetLeft + cell.offsetWidth / 2 + (xOff || 0);
  var y = cell.offsetTop + cell.offsetHeight / 2;
  piece.style.left = x + 'px';
  piece.style.top = y + 'px';
}

function scrollToCell(idx) {
  var cell = document.querySelector('.cell[data-idx="' + idx + '"]');
  if (!cell) return;
  // scrollIntoView 会自动滚动最近的可滚动祖先
  cell.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// 掷骰子主流程
async function handleRoll() {
  if (S.animating) return;
  S.animating = true;
  var rollBtn = document.getElementById('btn-roll');
  rollBtn.disabled = true;

  var gs = S.gameState;
  var result = Math.floor(Math.random() * 6) + 1;

  // 骰子动画
  await animateDice(result);
  await sleep(300);

  // 计算目标位置
  var player = gs.currentTurn;
  var curPos = player === 'male' ? gs.malePosition : gs.femalePosition;
  var targetPos = Math.min(curPos + result, gs.totalSteps);

  // 棋子逐格移动
  await animateMovement(player, curPos, targetPos);

  // 更新位置
  if (player === 'male') gs.malePosition = targetPos;
  else gs.femalePosition = targetPos;
  positionPieces();
  updatePosUI();
  scrollToCell(targetPos);
  saveGameState();

  // 判断胜利
  if (targetPos >= gs.totalSteps) {
    await sleep(300);
    handleVictory(player);
    return;
  }

  // 显示事件弹窗
  var ev = gs.shuffledEvents[targetPos - 1];
  showEventPopup(targetPos, ev ? ev.event : '安全区：什么都不发生', false);
}

// 骰子翻滚动画
async function animateDice(result) {
  var ov = document.getElementById('dice-ov');
  var val = document.getElementById('dice-val');
  var faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
  ov.classList.add('active');

  var intervals = [50,55,60,65,75,85,100,120,150,190,240];
  for (var i = 0; i < intervals.length; i++) {
    val.textContent = faces[Math.floor(Math.random() * 6)];
    val.style.transform = 'rotate(' + (Math.random() * 40 - 20) + 'deg) scale(' + (0.85 + Math.random() * 0.3) + ')';
    await sleep(intervals[i]);
  }
  // 定格结果
  val.textContent = faces[result - 1];
  val.style.transform = 'rotate(0) scale(1.15)';
  await sleep(250);
  val.style.transform = 'rotate(0) scale(1)';
  await sleep(350);
  ov.classList.remove('active');
}

// 棋子逐格跳动动画
async function animateMovement(player, from, to) {
  var pieceId = player === 'male' ? 'piece-m' : 'piece-f';
  var piece = document.getElementById(pieceId);
  var step = from < to ? 1 : -1;

  for (var pos = from + step; ; pos += step) {
    if (step > 0 && pos > to) break;
    if (step < 0 && pos < to) break;

    // 判断同格偏移
    var gs = S.gameState;
    var otherPos = player === 'male' ? gs.femalePosition : gs.malePosition;
    var same = pos === otherPos;
    var off = same ? (player === 'male' ? -13 : 13) : 0;

    placePiece(pieceId, pos, off);

    // 弹跳效果
    piece.classList.remove('piece-bouncing');
    void piece.offsetWidth; // 强制 reflow
    piece.classList.add('piece-bouncing');

    await sleep(280);

    if (pos === to) break;
  }
  piece.classList.remove('piece-bouncing');
}

// 事件弹窗
function showEventPopup(step, eventText, isChained) {
  var title = isChained ? '✨ 触发效果' : '第 ' + step + ' 步';
  showModal(title, eventText, [
    { text: '✅ 完成 / 下一回合', cls: 'mbtn-pri', fn: function() { onEventDone(eventText, isChained, step); } }
  ]);
}

// 事件完成后的处理
async function onEventDone(eventText, isChained, step) {
  if (isChained) {
    // 连锁事件不再执行机制，直接切换回合
    finishTurn();
    return;
  }

  // 检测通用玩法的游戏机制
  var fwd = eventText.match(/前进(\d+)步/);
  var bwd = eventText.match(/后退(\d+)步/);
  var reroll = eventText.indexOf('再掷一次') !== -1;

  if (fwd) {
    await executeMechanic(parseInt(fwd[1]), true);
  } else if (bwd) {
    await executeMechanic(-parseInt(bwd[1]), false);
  } else if (reroll) {
    // 不切换回合，可再掷
    saveGameState();
    S.animating = false;
    document.getElementById('btn-roll').disabled = false;
    showToast('🎲 再掷一次！');
  } else {
    finishTurn();
  }
}

// 执行前进/后退机制
async function executeMechanic(delta, isForward) {
  var gs = S.gameState;
  var player = gs.currentTurn;
  var curPos = player === 'male' ? gs.malePosition : gs.femalePosition;
  var targetPos = curPos + delta;
  if (targetPos > gs.totalSteps) targetPos = gs.totalSteps;
  if (targetPos < 0) targetPos = 0;

  await animateMovement(player, curPos, targetPos);

  if (player === 'male') gs.malePosition = targetPos;
  else gs.femalePosition = targetPos;
  positionPieces();
  updatePosUI();
  scrollToCell(targetPos);
  saveGameState();

  if (targetPos >= gs.totalSteps) {
    await sleep(300);
    handleVictory(player);
    return;
  }

  if (targetPos > 0) {
    var ev = gs.shuffledEvents[targetPos - 1];
    if (ev) {
      showEventPopup(targetPos, ev.event, true); // 连锁事件
      return;
    }
  }
  finishTurn();
}

function finishTurn() {
  var gs = S.gameState;
  gs.currentTurn = gs.currentTurn === 'male' ? 'female' : 'male';
  saveGameState();
  updateTurnUI();
  S.animating = false;
  document.getElementById('btn-roll').disabled = false;
}

// 胜利处理
function handleVictory(player) {
  var name = player === 'male' ? '♂ 男方' : '♀ 女方';

  // canvas-confetti 撒花
  if (typeof confetti === 'function') {
    var end = Date.now() + 3500;
    (function frame() {
      confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.6 }, colors: ['#FFB6C1','#FF69B4','#FFD700','#FF4500','#9C27B0'] });
      confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.6 }, colors: ['#FFB6C1','#FF69B4','#FFD700','#FF4500','#9C27B0'] });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  }

  clearGameState();

  showModal('🎉 恭喜！', name + ' 获胜！\n\n奖励：可以要求对方做任意一件事！', [
    { text: '🔄 再来一局', cls: 'mbtn-pri', fn: function() { S.animating = false; initNewGame(S.gameState.mapId, S.gameState.totalSteps); } },
    { text: '🏠 回到主页', cls: 'mbtn-sec', fn: function() { S.animating = false; showPage('home'); } }
  ]);
}

function updateTurnUI() {
  var ind = document.getElementById('turn-ind');
  if (!S.gameState) return;
  var male = S.gameState.currentTurn === 'male';
  ind.className = 'turn-ind ' + (male ? 'male' : 'female');
  ind.textContent = male ? '♂ 男方的回合' : '♀ 女方的回合';
}

function updatePosUI() {
  if (!S.gameState) return;
  var mp = S.gameState.malePosition;
  var fp = S.gameState.femalePosition;
  document.getElementById('pos-m').textContent = '他：' + (mp === 0 ? '起点' : '第 ' + mp + ' 步');
  document.getElementById('pos-f').textContent = '她：' + (fp === 0 ? '起点' : '第 ' + fp + ' 步');
}

function saveGameState() {
  try { localStorage.setItem('game_state', JSON.stringify(S.gameState)); } catch(e) {}
}

function loadGameState() {
  try {
    var d = localStorage.getItem('game_state');
    return d ? JSON.parse(d) : null;
  } catch(e) { return null; }
}

function clearGameState() {
  try { localStorage.removeItem('game_state'); } catch(e) {}
}

async function exitGame() {
  var ok = await confirmDialog('退出游戏', '确定要退出吗？当前进度会自动保存。');
  if (ok) {
    saveGameState();
    S.animating = false;
    showPage('home');
  }
}

// ============================================================
// 八、页面 C：设置页
// ============================================================

function initSettings() {
  // 复制当前配置用于编辑
  S.editMaps = deepClone(S.config.maps);
  S.editCommon = deepClone(S.config.commonEvents);
  S.settingsTab = 'pure';
  renderSettingsTabs();
  renderSettingsContent();
}

function renderSettingsTabs() {
  var tabsEl = document.getElementById('stabs');
  tabsEl.innerHTML = '';
  var tabs = MAP_IDS.map(function(id) {
    return { id: id, label: S.config.maps[id].emoji + ' ' + S.config.maps[id].name };
  });
  tabs.push({ id: 'common', label: '📦 通用玩法池' });

  tabs.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'stab' + (S.settingsTab === t.id ? ' active' : '');
    btn.textContent = t.label;
    var tc = t.id === 'common' ? '#78909C' : S.config.maps[t.id].themeColor;
    btn.style.setProperty('--tc', tc);
    btn.onclick = function() { S.settingsTab = t.id; renderSettingsTabs(); renderSettingsContent(); };
    tabsEl.appendChild(btn);
  });
}

function renderSettingsContent() {
  var el = document.getElementById('scontent');
  el.innerHTML = '';
  var tabId = S.settingsTab;
  var isCommon = tabId === 'common';

  // 档位信息展示（只读，仅方案 Tab）
  if (!isCommon) {
    var map = S.editMaps[tabId];
    var modes = map.modes || [];
    if (modes.length > 0) {
      var row = document.createElement('div');
      row.className = 'steps-row';
      row.style.flexDirection = 'column';
      row.style.alignItems = 'flex-start';
      row.style.gap = '6px';
      var lbl = document.createElement('span');
      lbl.className = 'steps-lbl';
      lbl.textContent = '游戏档位';
      row.appendChild(lbl);
      var info = document.createElement('span');
      info.className = 'modes-info';
      info.textContent = modes.map(function(md) {
        return md.label + '（' + md.steps + '步 ' + md.duration + '）';
      }).join('　');
      row.appendChild(info);
      el.appendChild(row);
    }
  }

  // 事件列表
  var events = isCommon ? S.editCommon : S.editMaps[tabId].events;
  events.forEach(function(ev, idx) {
    var item = document.createElement('div');
    item.className = 'ev-item';

    var idxEl = document.createElement('div');
    idxEl.className = 'ev-idx';
    idxEl.textContent = idx + 1;
    item.appendChild(idxEl);

    var ta = document.createElement('textarea');
    ta.className = 'ev-text';
    ta.value = ev.event;
    ta.setAttribute('rows', '1');
    ta.style.setProperty('--tc', isCommon ? '#78909C' : S.config.maps[tabId].themeColor);
    ta.oninput = function() {
      ev.event = this.value;
      this.classList.remove('err');
    };
    // 自适应高度
    ta.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });
    item.appendChild(ta);

    var del = document.createElement('button');
    del.className = 'ev-del';
    del.textContent = '🗑️';
    del.setAttribute('aria-label', '删除');
    del.onclick = function() { deleteEvent(idx); };
    item.appendChild(del);

    el.appendChild(item);

    // 初始化高度
    requestAnimationFrame(function() {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    });
  });
}

function addNewEvent() {
  var isCommon = S.settingsTab === 'common';
  var events = isCommon ? S.editCommon : S.editMaps[S.settingsTab].events;
  var newId = events.length > 0 ? (typeof events[events.length - 1].id === 'string' ? 'c' + (events.length + 1) : events.length + 1) : 1;
  events.push({ id: newId, event: '' });
  renderSettingsContent();

  // 聚焦到新增的输入框
  requestAnimationFrame(function() {
    var all = document.querySelectorAll('.ev-text');
    if (all.length) {
      var last = all[all.length - 1];
      last.focus();
      last.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
}

async function deleteEvent(idx) {
  var isCommon = S.settingsTab === 'common';
  var events = isCommon ? S.editCommon : S.editMaps[S.settingsTab].events;

  if (events.length <= 1) {
    showToast('至少保留 1 条玩法');
    return;
  }

  var ok = await confirmDialog('删除确认', '确定删除这条玩法吗？');
  if (!ok) return;

  events.splice(idx, 1);
  renderSettingsContent();
}

async function saveSettings() {
  // 校验无空文案
  var allTabs = MAP_IDS.concat(['common']);
  for (var t = 0; t < allTabs.length; t++) {
    var tabId = allTabs[t];
    var events = tabId === 'common' ? S.editCommon : S.editMaps[tabId].events;
    for (var i = 0; i < events.length; i++) {
      if (!events[i].event.trim()) {
        S.settingsTab = tabId;
        renderSettingsTabs();
        renderSettingsContent();
        // 高亮空白输入框
        requestAnimationFrame(function() {
          var items = document.querySelectorAll('.ev-text');
          items.forEach(function(ta, j) {
            if (!ta.value.trim()) {
              ta.classList.add('err');
              if (j === i) ta.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
          });
        });
        showToast('玩法内容不能为空');
        return;
      }
    }
  }

  S.config.maps = deepClone(S.editMaps);
  S.config.commonEvents = deepClone(S.editCommon);
  saveLocalOverride();
  showToast('保存成功 ✅');
}

async function restoreToRemote() {
  var ok = await confirmDialog('恢复云端版本', '确定恢复为云端版本吗？\n你的本地修改将被覆盖。');
  if (!ok) return;

  clearLocalOverride();

  if (S.remoteConfig) {
    S.config.maps = deepClone(S.remoteConfig.maps);
    S.config.commonEvents = deepClone(S.remoteConfig.commonEvents);
  } else {
    // 尝试重新获取
    try {
      var resp = await fetch('./config.json?t=' + Date.now());
      if (resp.ok) {
        var data = await resp.json();
        S.remoteConfig = data;
        S.config.maps = deepClone(data.maps);
        S.config.commonEvents = deepClone(data.commonEvents);
      } else {
        showToast('无法获取云端配置');
        return;
      }
    } catch(e) {
      showToast('网络请求失败');
      return;
    }
  }

  S.editMaps = deepClone(S.config.maps);
  S.editCommon = deepClone(S.config.commonEvents);
  renderSettingsTabs();
  renderSettingsContent();
  showToast('已恢复为云端版本 ☁️');
}

async function restoreToDefault() {
  var ok = await confirmDialog('恢复内置默认', '确定恢复为内置默认数据吗？\n你的本地修改将被清除。');
  if (!ok) return;

  clearLocalOverride();
  S.config.maps = deepClone(DEFAULT_CONFIG.maps);
  S.config.commonEvents = deepClone(DEFAULT_CONFIG.commonEvents);
  S.editMaps = deepClone(S.config.maps);
  S.editCommon = deepClone(S.config.commonEvents);
  renderSettingsTabs();
  renderSettingsContent();
  showToast('已恢复为内置默认 🔄');
}

// ============================================================
// 九、初始化
// ============================================================

async function init() {
  await loadConfig();
  renderHome();

  // 绑定事件
  document.getElementById('btn-go-settings').onclick = function() { showPage('settings'); };
  document.getElementById('btn-exit').onclick = exitGame;
  document.getElementById('btn-roll').onclick = handleRoll;
  document.getElementById('btn-add').onclick = addNewEvent;
  document.getElementById('btn-save').onclick = saveSettings;
  document.getElementById('btn-cloud').onclick = restoreToRemote;
  document.getElementById('btn-def').onclick = restoreToDefault;
  document.getElementById('btn-back-home').onclick = function() { showPage('home'); };

  // 窗口 resize 时重新定位棋子
  window.addEventListener('resize', function() {
    if (S.currentPage === 'game') {
      requestAnimationFrame(positionPieces);
    }
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
